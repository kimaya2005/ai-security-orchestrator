<!DOCTYPE html>
<html>
<head>
    <title>Secure Dashboard</title>
    <style>
        body{
            margin:0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg,#141e30,#243b55);
            color:white;
            text-align:center;
        }

        .container{
            margin-top:80px;
        }

        h2{
            margin-bottom:10px;
        }

        p{
            color:#ccc;
            margin-bottom:30px;
        }

        .card-container{
            display:flex;
            justify-content:center;
            gap:25px;
            flex-wrap:wrap;
            margin-top:30px;
        }

        .card{
            background:#1c1c1c;
            padding:30px;
            width:220px;
            border-radius:12px;
            box-shadow:0 6px 18px rgba(0,0,0,0.5);
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-10px);
            box-shadow:0 10px 25px rgba(0,0,0,0.7);
        }

        .icon{
            font-size:40px;
            margin-bottom:15px;
        }

        button{
            margin-top:15px;
            padding:12px 18px;
            border:none;
            border-radius:8px;
            background:#00ffcc;
            font-size:15px;
            cursor:pointer;
            width:100%;
        }

        button:hover{
            background:#00e6b8;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🔐 Secure Dashboard</h2>
    <p>Authentication successful. System monitoring active.</p>

    <div class="card-container">

        <div class="card">
            <div class="icon">📜</div>
            <h3>Login History</h3>
            <form action="/history">
                <button type="submit">View History</button>
            </form>
        </div>

        <div class="card">
            <div class="icon">📊</div>
            <h3>Behaviour Analysis</h3>
            <form action="/analysis">
                <button type="submit">View Analysis</button>
            </form>
        </div>

    </div>
</div>

</body>
</html>
