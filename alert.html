<!DOCTYPE html>
<html>
<head>
    <title>Security Alert</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ff4e50, #f9d423);
            height: 100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            margin:0;
        }

        .box{
            background:white;
            padding:40px;
            border-radius:12px;
            text-align:center;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
            width:350px;
        }

        h2{
            color:#d63031;
            margin-bottom:10px;
        }

        p{
            color:#555;
            margin:8px 0;
        }

        .icon{
            font-size:50px;
            margin-bottom:10px;
        }

        .btn{
            margin-top:20px;
            padding:12px 25px;
            border:none;
            background:#d63031;
            color:white;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
        }

        .btn:hover{
            background:#b71c1c;
        }
    </style>
</head>
<body>

<div class="box">
    <div class="icon">⚠</div>
    <h2>Suspicious Login Detected</h2>
    <p>We noticed a login attempt from a new device or location.</p>
    <p>For your security, OTP verification is required.</p>

    <button class="btn" onclick="window.location.href='/otp'">
        Verify OTP
    </button>
</div>

</body>
</html>
